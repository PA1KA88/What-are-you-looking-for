name: Fix GitHub Pages SPA mount

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix Vue Router base and mount Home directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Ia("./"),routes:'
          s = s.replace(old, 'Ia("/What-are-you-looking-for/"),routes:', 1)
          old_mount = 'Uo(nl).use(o4).mount("#app");'
          new_mount = 'Uo(i4).mount("#app");'
          if old_mount not in s:
              raise SystemExit('target mount code not found')
          s = s.replace(old_mount, new_mount, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix GitHub Pages app mount"
          git push
