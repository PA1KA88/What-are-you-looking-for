name: Fix GitHub Pages SPA base

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-route:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix Vue Router base for project Pages path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Ia("./"),routes:'
          new = 'Ia("/What-are-you-looking-for/"),routes:'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No route change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix GitHub Pages Vue Router base"
          git push
